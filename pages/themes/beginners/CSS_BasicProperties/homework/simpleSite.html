<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Homework</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('../images/blake-verdoorn-cssvEZacHvQ-unsplash.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        header {
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5));
            padding: 10px 0;
        }

        nav ul {
            list-style-type: none;
            text-align: center;
        }

        nav ul li {
            display: inline-block;
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        nav ul li a:hover {
            color: #ff6347;
        }

        article {
            margin: 20px auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            width: 80%;
        }

        img {
            width: 100%;
            max-width: 500px;
            border: 5px solid #fff;
            border-radius: 15px;
        }

        footer {
            background-color: #333;
            padding: 10px 0;
            text-align: center;
            color: white;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="#"><i class="fas fa-phone"></i> Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h1>Welcome to My Website</h1>
            <img src="image.jpg" alt="Nature" />
            <p>This is a simple webpage to showcase CSS skills.</p>
        </article>
    </main>

    <footer>
        <p>© 2024 My Website. All Rights Reserved.</p>
    </footer>
</body>
</html>
